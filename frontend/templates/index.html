    <!DOCTYPE html>

    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Upper-Tribunal Web Scraper</title>
        <link rel="stylesheet" href="../styles/style.css">
    </head>


    <body>
        <h1 class="align-center">Upper-Tribunal Web Scraper</h1>
        <!--Stuff to use
        https://www.w3schools.com/html/html_attributes.asp title attribute
        -->
          <div class="how-to-use">
    <p class="align-center">How to use:</p>
  </div>

        <div class="container">
        <div class="main">
            <p class="align-left">Search</p>
            <!-- Search form goes here, mostly dropdown boxes:
            fieldnames = [
            "title", 
            "neutral_citation", 
            "category", 
            "subcategory",
            "decision_date", 
            "html_url", 
            "pdf_url"]-->
            
            <div class="form-row">
                <label for="category">Category:</label>
                <select id="category">
                    <option value="" disabled selected>Select Category</option>
                    <option value="COMPENSATION">1 COMPENSATION</option>
                    <option value="RATING">2 RATING</option>
                    <option value="RESTRICTIVE COVENANTS">3 RESTRICTIVE COVENANTS</option>
                    <option value="LEASEHOLD ENFRANCHISEMENT">4 LEASEHOLD ENFRANCHISEMENT</option>
                    <option value="LANDLORD AND TENANT">5 LANDLORD AND TENANT</option>
                    <option value="BLIGHT NOTICE">6 BLIGHT NOTICE</option>
                    <option value="TAX">7 TAX</option>
                    <option value="EASEMENT">8 EASEMENT</option>
                    <option value="ARBITRATION">9 ARBITRATION</option>
                    <option value="COSTS">10 COSTS</option>
                    <option value="HOUSING">16 HOUSING</option>
                    <option value="PARK HOMES">19 PARK HOMES</option>
                    <option value="LAND REGISTRATION">25 LAND REGISTRATION</option>
                    <option value="ELECTRONIC COMMUNICATIONS CODE">26 ELECTRONIC COMMUNICATIONS CODE</option>
                    <option value="INTERIM RIGHTS">27 INTERIM RIGHTS</option>
                    <option value="ELECTRICITY CHARGES">28 ELECTRICITY CHARGES</option>
                    <option value="BUILDING SAFETY">29 BUILDING SAFETY</option>
                </select>
            </div>

            <div class="form-row">
            <label for="subcategory">Subcategory:</label>
            <select id="subcategory">
                <option value="" disabled selected>Select Subcategory</option>
            </select>
            </div>

            <div class="form-row">
                <label for="title">Title:</label>
                <input id="title" name="title" type="text" placeholder="Title">
            </div>

            <div class="form-row">
                <label for="neutral_citation">Neutral Citation:</label>
                <input id="neutral_citation" name="neutral_citation" type="text" placeholder="NCN">
            </div>

            <div class="form-row">
                <label for="from_date">From Date:</label>
                <input id="from_date" name="from_date" type="date">
            </div>

            <div class="form-row">
                <label for="to_date">To Date:</label>
                <input id="to_date" name="to_date" type="date">
            </div>
            
            <script>
                const fromDate = document.getElementById("from_date");
                const toDate = document.getElementById("to_date");

                fromDate.addEventListener("change", () => {
                toDate.min = fromDate.value;   //Setting earliest allowed To Date
                if (toDate.value && toDate.value < fromDate.value) {
                    toDate.value = fromDate.value; // auto-correct if already invalid
                }
                });
            </script>
            
             <div class="form-row">
                <button id="searchBtn" onclick="searchCases()">Search</button>
            </div>



        </div>
        <div class="database">
            <p class="align-center">Database content goes here.</p>
        </div>
    </div>


<script src="../../backend/scripts/dependent_dropdown.js"></script>
<script>
async function searchCases() {
  const category = document.getElementById("category").value;
  const subcategory = document.getElementById("subcategory").value;
  const title = document.getElementById("title").value.trim();
  const neutralCitation = document.getElementById("neutral_citation").value.trim();
  const fromDate = document.getElementById("from_date").value;
  const toDate = document.getElementById("to_date").value;
  const resultsDiv = document.querySelector(".database");

  resultsDiv.innerHTML = "<p>Loading results...</p>";

  const params = new URLSearchParams({
    category,
    subcategory,
    title,
    neutral_citation: neutralCitation,
    from_date: fromDate,
    to_date: toDate
  });

  try {
    const response = await fetch(`http://127.0.0.1:5000/cases?${params.toString()}`);
    const data = await response.json();

    if (data.length === 0) {
      resultsDiv.innerHTML = "<p>No results found.</p>";
      return;
    }

    // Clear results and show cases
    resultsDiv.innerHTML = "";
    data.forEach(c => {
      const div = document.createElement("div");
      div.classList.add("case");
      div.innerHTML = `
        <h3>${c.title}</h3>
        <p><strong>Citation:</strong> ${c.neutral_citation || "N/A"}</p>
        <p><strong>Date:</strong> ${c.decision_date || "N/A"}</p>
        <p><strong>Category:</strong> ${c.category || "N/A"} – ${c.subcategory || ""}</p>
        <p><strong>Subject:</strong> ${c.subject || "No summary provided"}</p>
        <p>
          ${c.html_url ? `<a href="${c.html_url}" target="_blank">View HTML</a>` : ""}
          ${c.pdf_url ? ` | <a href="${c.pdf_url}" target="_blank">Download PDF</a>` : ""}
        </p>
        <hr>
      `;
      resultsDiv.appendChild(div);
    });

  } catch (error) {
    console.error(error);
    resultsDiv.innerHTML = "<p>Error loading cases. Check console.</p>";
  }
}
</script>

  
    </body>
    </html>
